<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#134A8E">
<meta name="description" content="Blue Jays Bullpen — daily bullpen usage, pitch counts and stats.">
<title>Blue Jays Bullpen</title>

<style>
  :root{
    --blue:#134A8E;
    --deep-blue:#0B2F63;
    --red:#C8202F;
    --ink:#101820;
    --muted:#667085;
    --line:#D9DEE7;
    --paper:#F5F7FA;
    --white:#FFFFFF;

    /* DO NOT CHANGE: bullpen pitch-count legend */
    --tier-0:#FFFFFF;
    --tier-0-line:#BFC7D4;
    --tier-1:#BFD7F2;
    --tier-2:#F5A524;
    --tier-3:#FF1111;
    --tier-nr:#A6A6A6;
    --tier-nr-ink:#222222;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:Arial,Helvetica,sans-serif;
  }

  .topline{
    height:7px;
    background:linear-gradient(90deg,var(--blue) 0 82%,var(--red) 82% 100%);
  }

  .site-header{
    background:var(--white);
    border-bottom:1px solid var(--line);
  }

  .header-inner{
    width:min(1180px,calc(100% - 32px));
    margin:auto;
    min-height:92px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
  }

  .brand-mark{
    width:46px;
    height:46px;
    border:3px solid var(--blue);
    border-radius:50%;
    display:grid;
    place-items:center;
    color:var(--red);
    font-size:22px;
    font-weight:900;
    line-height:1;
  }


  .brand-logo{
    width:64px;
    height:64px;
    object-fit:contain;
    flex:0 0 64px;
    display:block;
  }

  .brand-copy small{
    display:block;
    color:var(--red);
    font-size:10px;
    font-weight:800;
    letter-spacing:.18em;
    text-transform:uppercase;
    margin-bottom:3px;
  }

  .brand-copy strong{
    display:block;
    color:var(--deep-blue);
    font-size:25px;
    line-height:1;
    letter-spacing:-.04em;
    text-transform:uppercase;
  }

  .header-actions{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .refresh-btn{
    appearance:none;
    border:1px solid var(--blue);
    background:var(--blue);
    color:#fff;
    border-radius:5px;
    padding:10px 15px;
    font-weight:800;
    font-size:12px;
    cursor:pointer;
  }

  .refresh-btn:hover{background:var(--deep-blue)}
  .refresh-btn:disabled{opacity:.65;cursor:wait}

  main{
    width:min(1180px,calc(100% - 32px));
    margin:0 auto;
    padding:28px 0 70px;
  }

  .intro{
    display:grid;
    grid-template-columns:1fr auto;
    gap:24px;
    align-items:end;
    margin-bottom:20px;
  }

  .eyebrow{
    color:var(--red);
    font-size:11px;
    font-weight:900;
    letter-spacing:.16em;
    text-transform:uppercase;
    margin:0 0 7px;
  }

  h1{
    margin:0;
    color:var(--deep-blue);
    font-size:clamp(34px,6vw,58px);
    line-height:.92;
    letter-spacing:-.055em;
    text-transform:uppercase;
  }

  .date-line{
    margin:10px 0 0;
    color:var(--muted);
    font-size:14px;
    font-weight:700;
  }

  .starter-card{
    min-width:250px;
    border-left:5px solid var(--red);
    background:#fff;
    border-top:1px solid var(--line);
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:14px 17px;
  }

  .starter-card span{
    display:block;
    color:var(--muted);
    font-size:10px;
    font-weight:900;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-bottom:5px;
  }

  .starter-card strong{
    color:var(--deep-blue);
    font-size:20px;
  }

  .panel{
    background:#fff;
    border:1px solid var(--line);
    box-shadow:0 5px 18px rgba(16,24,40,.06);
  }

  .panel-head{
    min-height:66px;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }

  .panel-title{
    margin:0;
    color:var(--deep-blue);
    font-size:18px;
    font-weight:900;
    letter-spacing:.01em;
    text-transform:uppercase;
  }

  .updated{
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
  }

  .table-wrap{overflow-x:auto}

  table{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
    table-layout:fixed;
  }

  col.player{width:190px}
  col.day{width:92px}
  col.total{width:104px}
  col.ip{width:70px}
  col.era{width:92px}

  thead th{
    color:var(--deep-blue);
    background:#F7F9FC;
    border-bottom:2px solid var(--deep-blue);
    padding:12px 10px;
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.04em;
    text-align:center;
    white-space:nowrap;
  }

  thead th:first-child{text-align:left}
  thead .group th{
    background:#fff;
    color:var(--muted);
    border-bottom:1px solid var(--line);
    padding:10px 10px 5px;
    font-size:10px;
    letter-spacing:.12em;
  }

  tbody td{
    height:48px;
    padding:8px 10px;
    border-bottom:1px solid var(--line);
    text-align:center;
    font-variant-numeric:tabular-nums;
    font-size:14px;
    font-weight:800;
  }

  tbody td.player{
    text-align:left;
    color:var(--ink);
    font-size:14px;
    font-weight:800;
  }

  tbody tr:hover td.player{color:var(--blue)}

  tbody tr.totals td{
    background:#F4F6F9;
    border-top:3px solid var(--deep-blue);
    border-bottom:0;
    color:var(--deep-blue);
    font-weight:900;
  }

  /* Exact pitch-count legend colors */
  td.tier-0{
    background:var(--tier-0);
    color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--tier-0-line);
  }
  td.tier-1{background:var(--tier-1);color:var(--ink)}
  td.tier-2{background:var(--tier-2);color:#221600}
  td.tier-3{background:var(--tier-3);color:#fff}
  td.tier-nr{
    background:var(--tier-nr);
    color:var(--tier-nr-ink);
    font-style:italic;
    font-weight:700;
  }

  .legend{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:0;
    border-top:1px solid var(--line);
    background:#fff;
    padding:0;
  }

  .legend-label{
    padding:15px 18px;
    color:var(--deep-blue);
    font-size:10px;
    font-weight:900;
    letter-spacing:.12em;
    text-transform:uppercase;
    border-right:1px solid var(--line);
  }

  .legend-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:15px 15px;
    color:#343A46;
    font-size:11px;
    font-weight:800;
    border-right:1px solid var(--line);
  }

  .swatch{
    width:18px;
    height:18px;
    display:inline-block;
    border:1px solid transparent;
  }

  .swatch.tier-0{background:var(--tier-0);border-color:var(--tier-0-line)}
  .swatch.tier-1{background:var(--tier-1)}
  .swatch.tier-2{background:var(--tier-2)}
  .swatch.tier-3{background:var(--tier-3)}
  .swatch.tier-nr{background:var(--tier-nr)}

  .status{
    padding:18px 20px;
    color:var(--muted);
    font-size:13px;
    font-weight:700;
  }

  .error{
    color:#9E1825;
    background:#FFF3F4;
    border-top:1px solid #F2C5CA;
  }


  .support-wrap{
    display:flex;
    justify-content:center;
    margin:24px 0 12px;
  }

  .support-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:11px 17px;
    background:#fff;
    color:var(--deep-blue);
    border:1px solid var(--blue);
    border-radius:5px;
    text-decoration:none;
    font-size:12px;
    font-weight:900;
    letter-spacing:.01em;
    transition:background .15s ease,color .15s ease;
  }

  .support-btn:hover{
    background:var(--blue);
    color:#fff;
  }

  footer{
    margin-top:18px;
    display:flex;
    justify-content:space-between;
    gap:20px;
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
  }

  footer a{
    color:var(--blue);
    font-weight:800;
    text-decoration:none;
  }


  @media(max-width:720px){
    .header-inner{min-height:76px}
    .brand-logo{width:52px;height:52px;flex-basis:52px}
    .brand-copy strong{font-size:20px}
    .header-actions .refresh-btn{padding:9px 11px}
    main{padding-top:20px}
    .intro{grid-template-columns:1fr;gap:16px}
    .starter-card{min-width:0}
    .panel-head{align-items:flex-start;flex-direction:column;gap:6px}
    footer{flex-direction:column}
  }
</style>
</head>

<script>
/*
  ================================================================
  BLUE JAYS BULLPEN — CONFIGURATION
  ================================================================

  Paste your published Google Sheet CSV URL here ONCE.

  Google Sheets:
  File → Share → Publish to web → choose your data sheet → CSV → Publish

  Example:
  https://docs.google.com/spreadsheets/d/e/XXXX/pub?gid=0&single=true&output=csv

  After that, daily changes happen in Google Sheets — NOT here.
*/
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1-vXx__dmwoR45P3zYQp01p0jgvG_b3BzpuuT5B5gQ_A/export?format=csv";

/*
  IMPORTANT SHEET FORMAT

  The data sheet should contain:

  Row 1:
  Starting Pitcher, Dylan Cease

  Row 2:
  Player, Aug 10, Aug 9, Aug 8, Aug 7, Aug 6, Last 3 Days, Last 5 Days, IP, ERA (5 Days)

  Then one player per row.

  Example:
  Starting Pitcher,Dylan Cease
  Player,Aug 10,Aug 9,Aug 8,Aug 7,Aug 6,Last 3 Days,Last 5 Days,IP,ERA (5 Days)
  Tyler Rogers,18,13,0,35,0,31,66,3.0,3.00

  You can also put the starting-pitcher row anywhere above the player
  header. The site will find it automatically.

  Blank pitch-count cells are treated as NR (not on roster).
*/

const REFRESH_INTERVAL_MS = 30000; // checks the sheet every 30 seconds
let refreshTimer = null;

function parseCSV(text){
  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;

  for(let i=0;i<text.length;i++){
    const ch = text[i];

    if(ch === '"'){
      if(quoted && text[i+1] === '"'){
        cell += '"';
        i++;
      }else{
        quoted = !quoted;
      }
    }else if(ch === ',' && !quoted){
      row.push(cell.trim());
      cell = "";
    }else if((ch === '\n' || ch === '\r') && !quoted){
      if(ch === '\r' && text[i+1] === '\n') i++;
      row.push(cell.trim());
      cell = "";
      if(row.some(v => v !== "")) rows.push(row);
      row = [];
    }else{
      cell += ch;
    }
  }

  if(cell !== "" || row.length){
    row.push(cell.trim());
    if(row.some(v => v !== "")) rows.push(row);
  }

  return rows.map(r => r.map(v => v.replace(/^"|"$/g,"").trim()));
}

function normalize(s){
  return String(s ?? "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g," ")
    .replace(/[()]/g,"");
}

function findHeaderIndex(rows){
  const idx = rows.findIndex(row =>
    normalize(row[0]) === "player" ||
    normalize(row[0]) === "pitcher" ||
    normalize(row[0]) === "name"
  );
  return idx;
}

function findStarter(rows){
  for(const row of rows){
    const key = normalize(row[0]);
    if(key === "starting pitcher" || key === "starter"){
      return row.slice(1).find(v => String(v).trim() !== "") || "—";
    }
  }
  return "—";
}

function isNumber(v){
  return v !== "" && v !== null && v !== undefined && !isNaN(Number(v));
}

function tierFor(value){
  if(value === null || value === undefined) return "nr";
  const s = String(value).trim();
  if(!s || s.toUpperCase() === "NR") return "nr";

  const n = Number(s);
  if(isNaN(n)) return "nr";
  if(n === 0) return "0";
  if(n <= 20) return "1";
  if(n <= 35) return "2";
  return "3";
}

function displayCell(value){
  const tier = tierFor(value);
  if(tier === "nr") return `<td class="tier-nr">NR</td>`;
  return `<td class="tier-${tier}">${escapeHTML(value)}</td>`;
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function parseSheet(text){
  const rows = parseCSV(text);
  const headerIndex = findHeaderIndex(rows);

  if(headerIndex < 0){
    throw new Error("Could not find a row beginning with Player.");
  }

  const header = rows[headerIndex];
  const normalizedHeaders = header.map(normalize);

  // Find the named summary/stat columns instead of assuming they are the
  // last four columns. This prevents extra/blank Google Sheet columns from
  // being mistaken for pitch-count days and rendered as gray "NR" cells.
  const last3Index = normalizedHeaders.findIndex(h => h === "last 3 days");
  const last5Index = normalizedHeaders.findIndex(h => h === "last 5 days");
  const ipIndex = normalizedHeaders.findIndex(h => h === "ip");
  const eraIndex = normalizedHeaders.findIndex(h =>
    h === "era 5 days" || h === "era (5 days)" || h === "era"
  );

  if(last3Index < 0 || last5Index < 0 || ipIndex < 0 || eraIndex < 0){
    throw new Error("Could not find the Last 3 Days, Last 5 Days, IP, and ERA columns in the Google Sheet.");
  }

  const statStart = Math.min(last3Index, last5Index, ipIndex, eraIndex);
  const dateIndices = [];

  for(let i = 1; i < statStart; i++){
    const label = String(header[i] ?? "").trim();
    if(label) dateIndices.push(i);
  }

  if(!dateIndices.length){
    throw new Error("No date columns were found.");
  }

  const dates = dateIndices.map(i => header[i]);

  const dataRows = rows.slice(headerIndex + 1).filter(row => {
    const name = normalize(row[0]);
    return row[0] &&
      name !== "totals" &&
      name !== "legend" &&
      name !== "pitch count legend" &&
      name !== "starting pitcher" &&
      name !== "starter";
  });

  const players = dataRows.map(row => ({
    name: row[0],
    pitch: dateIndices.map(i => row[i] ?? ""),
    last3: row[last3Index] ?? "",
    last5: row[last5Index] ?? "",
    ip: row[ipIndex] ?? "",
    era: row[eraIndex] ?? ""
  })).filter(p => p.name);

  return {
    starter: findStarter(rows),
    dates,
    players
  };
}

function buildTable(data){
  const {dates, players} = data;
  const colgroup = document.getElementById("colgroup");
  const groupRow = document.getElementById("groupRow");
  const headerRow = document.getElementById("headerRow");
  const tbody = document.getElementById("tableBody");

  colgroup.innerHTML =
    `<col class="player">` +
    dates.map(() => `<col class="day">`).join("") +
    `<col class="total"><col class="total"><col class="ip"><col class="era">`;

  groupRow.innerHTML =
    `<th></th><th colspan="${dates.length}">Pitch Count</th>` +
    `<th colspan="2">Total Pitches</th><th colspan="2">Stats</th>`;

  headerRow.innerHTML =
    `<th>Player</th>` +
    dates.map(d => `<th>${escapeHTML(d)}</th>`).join("") +
    `<th>Last 3 Days</th><th>Last 5 Days</th><th>IP</th><th>ERA (5 Days)</th>`;

  const totals = new Array(dates.length).fill(0);
  let last3Total = 0;
  let last5Total = 0;

  let html = "";

  for(const player of players){
    html += `<tr><td class="player">${escapeHTML(player.name)}</td>`;

    player.pitch.forEach((value,i) => {
      if(isNumber(value)) totals[i] += Number(value);
      html += displayCell(value);
    });

    if(isNumber(player.last3)) last3Total += Number(player.last3);
    if(isNumber(player.last5)) last5Total += Number(player.last5);

    html += `<td>${escapeHTML(player.last3 || "—")}</td>`;
    html += `<td>${escapeHTML(player.last5 || "—")}</td>`;
    html += `<td>${escapeHTML(player.ip || "—")}</td>`;
    html += `<td>${escapeHTML(player.era || "—")}</td></tr>`;
  }

  html += `<tr class="totals"><td class="player">Totals</td>`;
  totals.forEach(total => html += `<td>${total}</td>`);
  html += `<td>${last3Total}</td><td>${last5Total}</td><td></td><td></td></tr>`;

  tbody.innerHTML = html;
}

function getCurrentDateLabel(){
  return new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Toronto",
    month: "short",
    day: "numeric"
  }).format(new Date());
}

function setData(data, sourceLabel){
  document.getElementById("starter").textContent = data.starter || "—";
  // The report date is always the current Toronto date. The pitch-count
  // column dates below continue to come directly from the Google Sheet.
  document.getElementById("dateLine").textContent = getCurrentDateLabel();

  buildTable(data);

  document.getElementById("status").hidden = true;
  document.getElementById("tableWrap").hidden = false;
  // Live update timestamp intentionally hidden from the public page.

}

function showError(message){
  const status = document.getElementById("status");
  status.hidden = false;
  status.className = "status error";
  status.textContent = message;
  document.getElementById("tableWrap").hidden = true;
}

async function loadData({manual=false} = {}){
  const btn = document.getElementById("refreshBtn");

  if(manual){
    btn.disabled = true;
    btn.textContent = "UPDATING…";
  }

  try{
    /*
      Cache-busting query parameter is intentional:
      it tells the browser/proxy to request a fresh CSV instead of
      reusing an older cached response.
    */
    const separator = SHEET_CSV_URL.includes("?") ? "&" : "?";
    const freshURL = `${SHEET_CSV_URL}${separator}_=${Date.now()}`;

    const response = await fetch(freshURL, {
      method:"GET",
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error(`Google Sheet returned ${response.status}.`);
    }

    const text = await response.text();
    const data = parseSheet(text);

    setData(data, "Google Sheet");
  }catch(error){
    console.error(error);
    showError(`Unable to load the Google Sheet. Make sure the sheet is publicly readable. ${error.message}`);
  }finally{
    if(manual){
      btn.disabled = false;
      btn.textContent = "REFRESH";
    }
  }
}

document.getElementById("refreshBtn").addEventListener("click", () => {
  loadData({manual:true});
});

/*
  Automatic updating:
  the page checks the published Google Sheet every 30 seconds.
  You only edit the Google Sheet; the website updates itself.
*/
loadData();
refreshTimer = setInterval(() => loadData(), REFRESH_INTERVAL_MS);
